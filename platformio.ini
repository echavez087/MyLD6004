; Development build for this library repo (not used when the library is installed
; in another project). Compiles examples/BasicPresence against the library in src/.
;
;   pio run                       -> build BasicPresence
;   pio run -t upload -t monitor  -> flash + serial monitor
;
; Build any other example with:
;   pio ci examples/Diagnostics --lib . --board esp32dev

[platformio]
src_dir = examples/BasicPresence

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://.
build_flags = -Wall -Wextra

[env:esp32dev]

[env:esp32dev_debug]
build_flags = ${env.build_flags} -DMYLD6004_DEBUG
